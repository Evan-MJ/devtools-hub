name: Deploy to Cloudflare Pages

# Auto-deploy on push to main.
#
# WHY (2026-11-09, BUG-483): the owner asked for "upload once -> deploy automatically".
# The Cloudflare Pages project `devtools-hub` has NO Git repository connected
# (source: null, every deploy is ad_hoc), so Cloudflare cannot build from GitHub.
# The GitHub Actions path is used instead:
#
#   scripts/publish-github.sh origin   -> pushes the local main TREE as one snapshot commit
#                                        (tree only, no history -> no secret-scanning hit
#                                         and the 7 leaked keys in the old history stay local)
#   this workflow                      -> checks out that commit, runs the deploy gate
#                                        (scripts/pre-deploy.sh) and deploys to Pages
#
# The gate matters: `wrangler pages deploy .` uploads the whole directory, so anything
# left in the working tree is published. scripts/pre-deploy.sh parks .env, the Playwright
# harness scripts and test-scripts/ outside the deploy root, refuses to deploy on a
# stale tool count or a leaked template value, and regenerates the AI-discovery files.
#
#   Settings -> Secrets and variables -> Actions -> CLOUDFLARE_API_TOKEN
#   (the same Pages:Edit token the build machine uses)

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push cancels the running one.
concurrency:
  group: pages-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22, not 20: wrangler refuses to run on Node < 22 (the 2026-11-06
          # dispatch died with "Wrangler requires at least Node.js v22.0.0").
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install

      # The gate also runs the deploy (scripts/pre-deploy.sh ends with
      # `wrangler pages deploy . --project-name devtools-hub --branch main`),
      # so there is no second deploy step here on purpose.
      - name: Deploy gate + deploy
        run: |
          bash scripts/pre-deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
